# Policy for the v3 guard demo (demo-pipewarden-v3-guards.yml).
#
# Every destination is a local HTTP server on a private address, named through
# /etc/hosts, so the job proves the guards without any third-party host.
version: "2"
mode: enforce

rules:
  - name: "internal host, no exemption (guard must block)"
    allow:
      domains: ["internal.pw-test"]
      ports: [80]
      protocols: [http]
  - name: "metadata alias (guard must block)"
    allow:
      domains: ["metadata.pw-test"]
      ports: [80]
      protocols: [http]
  - name: "exempted internal mirror, read-only"
    allow:
      domains: ["mirror.pw-test"]
      ports: [80]
      protocols: [http]
      allowed_ips: ["10.99.0.2/32"]
      access: read-only
  - name: "GitHub (the teardown action fetches upload-artifact mid-job)"
    allow:
      domains: ["api.github.com", "github.com", "codeload.github.com", "*.githubusercontent.com"]
      ports: [443]
      protocols: [https]
  - name: "GitHub-hosted runner watchdog"
    appears: sometimes
    allow:
      domains: ["hosted-compute-watchdog-*.githubapp.com"]
      ports: [443]
      protocols: [https]
