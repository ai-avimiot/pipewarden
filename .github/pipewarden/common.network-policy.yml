# Shared baseline applied to every pipeline (merged with the per-pipeline file).
# Maintained by hand — PipeWarden does not auto-generate this file.
version: "1"
mode: monitor

rules:
  - name: "GitHub"
    allow:
      domains:
        - "api.github.com"
        - "github.com"
        # Runner fetches action tarballs from here when a step resolves an action
        # mid-job (e.g. a local composite action's nested uses:).
        - "codeload.github.com"
        - "*.githubusercontent.com"
      ports: [443]
      protocols: [https]

  - name: "GitHub-hosted runner watchdog (the runner's own agent, not a step)"
    appears: sometimes
    allow:
      domains:
        - "hosted-compute-watchdog-*.githubapp.com"
      ports: [443]
      protocols: [https]

  - name: "Ubuntu packages"
    allow:
      domains:
        - "archive.ubuntu.com"
        - "security.ubuntu.com"
      ports: [80]
      protocols: [http]
