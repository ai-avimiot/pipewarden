name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # native-proxy/action is a node24 action: GitHub executes dist/ straight from
  # the repo, with no build step. A stale dist therefore ships old code to every
  # consumer while package.json looks up to date — which is exactly what happened
  # when Dependabot bumped @actions/cache and nobody rebuilt the bundle.
  check-dist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: native-proxy/action/package-lock.json

      - name: Rebuild the action bundle
        working-directory: native-proxy/action
        run: |
          npm ci
          npm test
          npm run build

      - name: Fail if dist/ is out of date
        run: |
          if ! git diff --quiet -- native-proxy/action/dist; then
            echo "::error title=Stale dist::native-proxy/action/dist does not match src/ + package.json. Run 'npm ci && npm run build' in native-proxy/action and commit the result."
            git --no-pager diff --stat -- native-proxy/action/dist
            exit 1
          fi
          echo "dist/ is in sync with src/."

      - name: Upload rebuilt dist on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: expected-dist
          path: native-proxy/action/dist

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements/requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/requirements-lock.txt

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Mypy (type-check policy core)
        run: mypy

  # Nothing else in CI installs proxy/requirements-lock.txt — it is consumed only
  # by the image build, which does not run on pull requests. That gap let an
  # unsatisfiable lock reach main and sit there for four days (#108: pyOpenSSL
  # 26.3.0 against cryptography<49), undetectable until the next release build.
  #
  # tests/test_lock_consistency.py catches contradictory pins offline, but only an
  # actual build proves the image works alongside the mitmproxy in the base image.
  # Building here makes that a pre-merge check rather than a post-merge discovery.
  proxy-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the proxy image
        run: docker build -f proxy/Dockerfile -t pipewarden-proxy:ci .

      - name: Verify the image is internally consistent
        run: |
          # pip check catches a lock that installed but left conflicting metadata;
          # importing the addon under the base image's interpreter catches a
          # dependency that resolved but cannot actually be used at runtime.
          docker run --rm --entrypoint sh pipewarden-proxy:ci -c '
            set -e
            pip check
            python3 -c "import OpenSSL, cryptography, yaml, certifi"
            python3 -c "import sys; sys.path.insert(0, \"/app\"); import addon"
            mitmdump --version | head -1
          '

  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements/requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/requirements-lock.txt

      - name: Run tests
        run: pytest -v --cov=policy --cov-report=term-missing
