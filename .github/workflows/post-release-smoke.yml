name: Post-release smoke (demo)

# After a release is published, run the consumer demo repo's workflows against the
# freshly published action (`ai-avimiot/pipewarden@latest`, now pointing at this
# release) to smoke-test the real, cross-repo consumer experience: action
# resolution, release tags, and GHCR images. This complements the in-repo
# local-ref demo workflows (which gate PRs before publishing).
#
# Requires a token with `actions: write` (and `contents: read`) on
# ai-avimiot/pipewarden-demo, stored as the secret DEMO_SMOKE_TOKEN
# (the default GITHUB_TOKEN cannot dispatch workflows in another repo).
# If the secret is absent the job FAILS loudly rather than skipping: a green run
# here means "the release was verified", so a silent no-op would be misread as a
# pass. See the DEMO_SMOKE_TOKEN guard below.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-release-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Dispatch demo workflows and wait
    runs-on: ubuntu-latest
    env:
      DEMO_REPO: ai-avimiot/pipewarden-demo
      GH_TOKEN: ${{ secrets.DEMO_SMOKE_TOKEN }}
      WORKFLOWS: "test-nodejs-native.yml container-scenario-native.yml nodejs-pipewarden.yml"
    steps:
      - name: Dispatch, wait, and report
        run: |
          set -euo pipefail

          # Shared because an absent token and an expired one need the same fix
          # but fail at different points: the -z check below catches "not set",
          # while an expired token sails past it and dies at the first dispatch.
          # Before this was shared, that second path printed a bare
          # "HTTP 401: Bad credentials" with no indication of what to do — which
          # is exactly how the v1.4.1 release failed on 2026-08-07.
          emit_token_help() {
            {
              echo "## Post-release smoke — NOT RUN"
              echo ""
              echo "$1"
              echo ""
              echo "The published release was **not** verified against \`${DEMO_REPO}\`."
              echo ""
              echo "Fix: create a token with \`actions: write\` (and \`contents: read\`) on \`${DEMO_REPO}\`"
              echo "and add it as the \`DEMO_SMOKE_TOKEN\` secret on this repository, then re-run this workflow."
              echo "Note the token's resource owner must be the \`${DEMO_REPO%%/*}\` organisation, not a personal account."
              echo ""
              echo "To verify by hand in the meantime:"
              echo ""
              echo '```bash'
              for wf in ${WORKFLOWS}; do
                echo "gh workflow run ${wf} --repo ${DEMO_REPO} --ref main"
              done
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          }

          if [ -z "${GH_TOKEN:-}" ]; then
            # Fail rather than skip. A green run here is read as "the release was
            # smoke-tested"; exiting 0 without dispatching anything makes a
            # no-op indistinguishable from a real pass, which is worse than no
            # check at all.
            emit_token_help "\`DEMO_SMOKE_TOKEN\` is not set."
            echo "::error title=Post-release smoke::DEMO_SMOKE_TOKEN not set — the release was NOT smoke-tested. Add a token with actions:write on ${DEMO_REPO}."
            exit 1
          fi

          # Mark the cutoff so we can find the runs we just triggered.
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "Dispatching demo workflows in ${DEMO_REPO}..."
          for wf in ${WORKFLOWS}; do
            echo "  -> ${wf}"
            # An expired token reaches here, not the -z check above, and gh
            # reports only "HTTP 401: Bad credentials". Catch it so the run
            # explains itself instead of leaving the reader to dig through logs.
            if ! gh workflow run "${wf}" --repo "${DEMO_REPO}" --ref main; then
              emit_token_help "Dispatching \`${wf}\` failed. The usual cause is an **expired** \`DEMO_SMOKE_TOKEN\` — an expired token passes the not-set check and fails here with \`HTTP 401: Bad credentials\`."
              echo "::error title=Post-release smoke::Could not dispatch ${wf} to ${DEMO_REPO} — the release was NOT smoke-tested. Regenerate DEMO_SMOKE_TOKEN (likely expired)."
              exit 1
            fi
          done

          # Give the runs a moment to register, then resolve their run IDs.
          sleep 20
          declare -A RUN_ID
          for wf in ${WORKFLOWS}; do
            rid="$(gh run list --repo "${DEMO_REPO}" --workflow "${wf}" --event workflow_dispatch \
                   --created ">=${before}" --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)"
            if [ -z "${rid}" ] || [ "${rid}" = "null" ]; then
              # Fallback: newest run for that workflow.
              rid="$(gh run list --repo "${DEMO_REPO}" --workflow "${wf}" --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)"
            fi
            RUN_ID[$wf]="${rid}"
            echo "  ${wf} -> run ${rid:-<none>}"
          done

          # Poll all runs to completion (cap ~25 min).
          deadline=$(( $(date +%s) + 1500 ))
          declare -A RESULT
          remaining="${WORKFLOWS}"
          while [ -n "${remaining}" ] && [ "$(date +%s)" -lt "${deadline}" ]; do
            still=""
            for wf in ${remaining}; do
              rid="${RUN_ID[$wf]:-}"
              if [ -z "${rid}" ]; then RESULT[$wf]="no-run"; continue; fi
              read -r status conclusion < <(gh run view "${rid}" --repo "${DEMO_REPO}" --json status,conclusion -q '"\(.status) \(.conclusion)"' 2>/dev/null || echo "unknown ")
              if [ "${status}" = "completed" ]; then
                RESULT[$wf]="${conclusion}"
              elif [ "${status}" = "waiting" ] || [ "${status}" = "action_required" ] || [ "${conclusion}" = "action_required" ]; then
                # GitHub is holding this run pending manual approval. Approval
                # requires an authenticated web session, so DEMO_SMOKE_TOKEN can
                # never clear it — polling to the deadline would just waste 25
                # minutes and report a misleading "timeout". Stop watching now.
                RESULT[$wf]="awaiting-approval"
              else
                still="${still} ${wf}"
              fi
            done
            remaining="${still# }"
            [ -n "${remaining}" ] && sleep 20 || true
          done

          # Summarize.
          echo "## Post-release demo smoke" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Demo workflow | Result | Run |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|---|---|---|" >> "${GITHUB_STEP_SUMMARY}"
          fail=0
          held=0
          for wf in ${WORKFLOWS}; do
            res="${RESULT[$wf]:-timeout}"
            rid="${RUN_ID[$wf]:-}"
            url="https://github.com/${DEMO_REPO}/actions/runs/${rid}"
            echo "| \`${wf}\` | ${res} | [run](${url}) |" >> "${GITHUB_STEP_SUMMARY}"
            echo "${wf}: ${res} (${url})"
            case "${res}" in
              success) ;;
              awaiting-approval) held=1 ;;
              *) fail=1 ;;
            esac
          done

          if [ "${held}" -ne 0 ]; then
            {
              echo ""
              echo "> One or more demo runs are **held for approval** by GitHub Actions."
              echo "> A collaborator with write access on \`${DEMO_REPO}\` must approve them from the"
              echo "> web UI — this cannot be done with a token. Re-run this workflow afterwards"
              echo "> to complete the smoke test."
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "::warning title=Post-release smoke::Demo run(s) held for approval — approve them in ${DEMO_REPO}, then re-run this workflow."
          fi

          if [ "${fail}" -ne 0 ]; then
            echo "::error title=Post-release smoke::One or more demo workflows did not succeed against the published release."
            exit 1
          fi
          if [ "${held}" -ne 0 ]; then
            echo "Smoke test incomplete: run(s) awaiting manual approval. Not treated as a failure."
            exit 0
          fi
          echo "All demo workflows passed against the published release."
