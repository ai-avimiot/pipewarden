name: "PipeWarden Demo: Container Mode"

on:
  push:
    branches: [main]
    paths:
      - 'demo-nodejs/**'
      - 'container/**'
      - 'proxy/**'
      - '.github/workflows/demo-pipewarden-container.yml'
  pull_request:
    paths:
      - 'demo-nodejs/**'
      - 'container/**'
      - 'proxy/**'
      - 'scripts/**'
      - 'policy/**'
      - '.github/workflows/demo-pipewarden-container.yml'
  workflow_dispatch:

# A commit and its release tag are pushed together; without this the demo runs
# twice for the same SHA. Cancel superseded runs on the same ref.
concurrency:
  group: demo-container-${{ github.ref }}
  cancel-in-progress: true

env:
  PIPEWARDEN_IMAGE: ghcr.io/${{ github.repository_owner }}/pipewarden:latest
  PIPEWARDEN_PROXY_IMAGE: ghcr.io/${{ github.repository_owner }}/pipewarden-proxy:latest
  PIPEWARDEN_RUNNER_IMAGE: ghcr.io/${{ github.repository_owner }}/pipewarden-runner:latest

jobs:
  container-mode:
    name: "Container mode (act + transparent proxy)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      # ============================================================================
      # STANDARD CI SETUP (same as any normal workflow)
      # ============================================================================
      
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Standard step: Check out your code

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        # Standard step: Authenticate to pull PipeWarden container images

      # ============================================================================
      # PIPEWARDEN CONTAINER MODE (runs your entire workflow in a monitored network)
      # ============================================================================
      
      # A PR must be tested against its own images: :latest is the last release.
      - name: Build images from this checkout (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          docker build -q -f proxy/Dockerfile -t pipewarden-proxy:ci .
          docker build -q -f container/Dockerfile -t pipewarden:ci .
          echo "PIPEWARDEN_IMAGE=pipewarden:ci" >> "$GITHUB_ENV"
          echo "PIPEWARDEN_PROXY_IMAGE=pipewarden-proxy:ci" >> "$GITHUB_ENV"

      - name: "🔒 Run CI commands in monitored container network"
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp:/tmp \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -v "$(dirname $GITHUB_STEP_SUMMARY):$(dirname $GITHUB_STEP_SUMMARY)" \
            -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
            -e GITHUB_WORKSPACE="${{ github.workspace }}" \
            -e GITHUB_STEP_SUMMARY="${GITHUB_STEP_SUMMARY}" \
            -e GITHUB_OUTPUT="${GITHUB_OUTPUT}" \
            -e INPUT_PIPELINE_CMD="apt-get update -qq && apt-get install -y -qq nodejs npm curl && cd demo-nodejs && npm install && npm test && npm run build && curl -s https://httpbin.org/ip" \
            -e INPUT_POLICY_FILE="${{ github.workspace }}/demo-nodejs/network-policy.yml" \
            -e INPUT_MODE=monitor \
            -e PIPEWARDEN_PROXY_IMAGE="${PIPEWARDEN_PROXY_IMAGE}" \
            "$PIPEWARDEN_IMAGE"
        # PipeWarden step: Runs your CI commands inside a monitored Docker network
        # - Executes commands in an ubuntu:22.04 container on monitored network
        # - Creates isolated Docker network with transparent proxy as gateway
        # - All HTTP/HTTPS traffic is automatically routed through the proxy
        # - Generates network monitoring report after commands complete
        # - Cleanup happens automatically when container exits

      # The workload must not reach a non-allowlisted host by any route. This
      # once succeeded: pipeline-command mode never routed HTTP via the proxy.
      - name: "Bypass check: enforce blocks a non-allowlisted host"
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp:/tmp \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
            -e GITHUB_WORKSPACE="${{ github.workspace }}" \
            -e INPUT_PIPELINE_CMD='exec 3<>/dev/tcp/1.1.1.1/80 && printf "GET / HTTP/1.0\r\nHost: one.one.one.one\r\n\r\n" >&3 && reply=$(timeout 10 head -1 <&3); echo "raw reply: ${reply:-<none>}"; case "$reply" in *" 200 "*|*" 301 "*|*" 302 "*) echo "LEAK: reached an unlisted host"; exit 1;; esac; echo "blocked as expected"' \
            -e INPUT_POLICY_FILE="${{ github.workspace }}/.github/pipewarden/demo-pipewarden-enforce.network-policy.yml" \
            -e INPUT_MODE=enforce \
            -e INPUT_FAIL_ON_BLOCK=false \
            -e PIPEWARDEN_PROXY_IMAGE="${PIPEWARDEN_PROXY_IMAGE}" \
            "$PIPEWARDEN_IMAGE"
