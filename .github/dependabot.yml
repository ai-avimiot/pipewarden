version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # tornado and msgpack are transitive dependencies of mitmproxy, which caps
    # them (tornado<=6.5.5, msgpack<=1.1.2). The lock already sits at those
    # ceilings, so independent Dependabot bumps only produce unmergeable PRs
    # (pip --require-hashes ResolutionImpossible). They move when mitmproxy is
    # bumped and the lock is regenerated via scripts/update-lock-files.sh.
    # cryptography is likewise capped by mitmproxy (<=48.1), so major bumps
    # to 49+ are unmergeable; within-range patch bumps are still allowed.
    # The remaining entries are other mitmproxy-capped deps sitting at their
    # ceilings (typing-extensions<=4.14, urwid<=3.0.5, aioquic==1.2.0,
    # pydivert<=2.1.0) and pyopenssl, whose 26.3+ releases require
    # cryptography>=49. Revisit ALL of these when mitmproxy is bumped.
    #
    # The full set of mitmproxy 12.2.3 ceilings the lock currently sits on
    # (verified against its PyPI metadata on 2026-07-28) is listed below. Any
    # bump past one of them is unmergeable by construction, so they are all
    # ignored above their ceiling rather than left to generate dead PRs:
    #   aioquic==1.2.0        argon2-cffi<=25.1.0   asgiref<=3.11.1
    #   bcrypt==5.0.0         brotli<=1.2.0         flask<=3.1.3
    #   h11==0.16.0           h2==4.3.0             hyperframe<=6.1.0
    #   kaitaistruct<=0.11    ldap3<=2.9.1          msgpack<=1.1.2
    #   publicsuffix2<=2.20191221                   pyparsing<=3.3.2
    #   pyperclip<=1.11.0     ruamel.yaml<=0.19.1   sortedcontainers<=2.4.0
    #   tornado<=6.5.5        typing-extensions<=4.14                urwid<=3.0.5
    #   wsproto<=1.3.2        zstandard<=0.25.0     pydivert<=2.1.0
    # cryptography (<=48.1) and pyopenssl (<=27.0.0) are NOT at their ceiling,
    # so they keep their existing narrower ignores and can still be bumped.
    # PRs #90 (h2 4.4.0) and #71 (asgiref 3.12.1) were closed for exactly this
    # reason. mitmproxy 12.2.3 is the newest release on PyPI, so nothing here
    # can be lifted yet.
    ignore:
      - dependency-name: "tornado"
      - dependency-name: "msgpack"
      - dependency-name: "cryptography"
        versions: [">=49"]
      - dependency-name: "typing-extensions"
        versions: [">4.14"]
      - dependency-name: "urwid"
        versions: [">3.0.5"]
      - dependency-name: "aioquic"
        versions: [">1.2.0"]
      - dependency-name: "pydivert"
        versions: [">2.1.0"]
      - dependency-name: "pyopenssl"
        versions: [">=26.3"]
      - dependency-name: "h2"
        versions: [">4.3.0"]
      - dependency-name: "asgiref"
        versions: [">3.11.1"]
      - dependency-name: "argon2-cffi"
        versions: [">25.1.0"]
      - dependency-name: "bcrypt"
        versions: [">5.0.0"]
      - dependency-name: "brotli"
        versions: [">1.2.0"]
      - dependency-name: "flask"
        versions: [">3.1.3"]
      - dependency-name: "h11"
        versions: [">0.16.0"]
      - dependency-name: "hyperframe"
        versions: [">6.1.0"]
      - dependency-name: "kaitaistruct"
        versions: [">0.11"]
      - dependency-name: "ldap3"
        versions: [">2.9.1"]
      - dependency-name: "publicsuffix2"
        versions: [">2.20191221"]
      - dependency-name: "pyparsing"
        versions: [">3.3.2"]
      - dependency-name: "pyperclip"
        versions: [">1.11.0"]
      - dependency-name: "ruamel.yaml"
        versions: [">0.19.1"]
      - dependency-name: "sortedcontainers"
        versions: [">2.4.0"]
      - dependency-name: "wsproto"
        versions: [">1.3.2"]
      - dependency-name: "zstandard"
        versions: [">0.25.0"]
    # mitmproxy-rs pins its platform wheels to its own exact version
    # (mitmproxy-rs 0.12.11 requires mitmproxy-linux/-macos/-windows==0.12.11).
    # Bumped individually they contradict each other and every such PR is
    # unmergeable (#88, #81). mitmproxy itself does NOT cap them
    # (mitmproxy-rs<0.13,>=0.12.6), so these bumps are wanted — they just have
    # to arrive as a single PR.
    groups:
      mitmproxy-rs:
        patterns:
          - "mitmproxy-rs"
          - "mitmproxy-linux"
          - "mitmproxy-macos"
          - "mitmproxy-windows"

  - package-ecosystem: "pip"
    directory: "/proxy"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # Same mitmproxy 12.2.3 ceilings as /requirements above: the proxy image is
    # built FROM mitmproxy/mitmproxy:12.2.3, so a cryptography or pyopenssl
    # past what that mitmproxy declares cannot be installed alongside it.
    # pyopenssl 26.3+ requires cryptography>=49, so it is capped transitively.
    # Without these, /proxy generates the same dead PRs /requirements already
    # suppresses (#107 cryptography 49.0.0, #112 cryptography 50.0.0).
    #
    # typing-extensions is capped at mitmproxy's <=4.14 and must stay there.
    # Dependabot does not only propose lock bumps here — it rewrites the
    # *constraint* to "permit the latest version" (#115 raised the cap to
    # <=4.16.0 and edited the explanatory comment to claim mitmproxy allows
    # it, which it does not). A ceiling dictated by the base image cannot be
    # inferred from what the package has published, so it is ignored outright.
    ignore:
      - dependency-name: "cryptography"
        versions: [">=49"]
      - dependency-name: "pyopenssl"
        versions: [">=26.3"]
      - dependency-name: "typing-extensions"
        versions: [">4.14"]

  - package-ecosystem: "npm"
    directory: "/native-proxy/action"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # @actions/artifact 6.x is ESM-only and pulls in @azure/storage-common's
    # emscripten/WASM crc64 module, which does not survive ncc bundling
    # (uploads fail at runtime with "crc64_require is not a function").
    # 5.x is the newest line that bundles and runs; a bump past it requires
    # re-verifying `npm run build` + a runtime smoke test of dist/teardown.
    # This also covers Dependabot *security* updates, which run even without
    # an npm config section (that's how the broken 6.2.1 bump in PR #17
    # landed without dist/ being rebuilt).
    # @actions/cache 6.x has the same Azure crc64 bundling breakage; 5.x is
    # the newest line that loads under ncc.
    ignore:
      - dependency-name: "@actions/artifact"
        versions: [">=6"]
      - dependency-name: "@actions/cache"
        versions: [">=6"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/native-proxy/action"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/native-proxy/action-setup"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/native-proxy/action-teardown"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/container"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/proxy"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/runner"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
