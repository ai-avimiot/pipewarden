version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # mitmproxy caps nearly every one of its transitives, and a bump past one of
    # those ceilings is unmergeable by construction (pip --require-hashes ResolutionImpossible).
    # Each is ignored above mitmproxy 12.3.0's ceiling (verified against its
    # PyPI metadata on 2026-10-22) rather than left to generate dead PRs, as
    # #90 (h2) and #71 (asgiref) once did. Revisit ALL of these when mitmproxy
    # is bumped, then regenerate via scripts/update-lock-files.sh.
    ignore:
      - dependency-name: "aioquic"
        versions: [">1.2.0"]
      - dependency-name: "argon2-cffi"
        versions: [">25.1.0"]
      - dependency-name: "asgiref"
        versions: [">3.12.1"]
      - dependency-name: "backports.zstd"
        versions: [">1.7.0"]
      - dependency-name: "bcrypt"
        versions: [">5.0.0"]
      - dependency-name: "brotli"
        versions: [">1.2.0"]
      - dependency-name: "cryptography"
        versions: [">50.0.2"]
      - dependency-name: "flask"
        versions: [">3.1.3"]
      - dependency-name: "h11"
        versions: [">0.16.0"]
      - dependency-name: "h2"
        versions: [">4.4.1"]
      - dependency-name: "hyperframe"
        versions: [">6.1.0"]
      - dependency-name: "kaitaistruct"
        versions: [">0.11"]
      - dependency-name: "ldap3"
        versions: [">2.9.1"]
      - dependency-name: "publicsuffix2"
        versions: [">2.20191221"]
      - dependency-name: "pydivert"
        versions: [">3.1.3"]
      - dependency-name: "pyopenssl"
        versions: [">27.0.0"]
      # Capped by aioquic 1.2.0 (pylsqpack<0.4.0), not by mitmproxy directly.
      - dependency-name: "pylsqpack"
        versions: [">=0.4"]
      - dependency-name: "pyparsing"
        versions: [">3.3.3"]
      - dependency-name: "pyperclip"
        versions: [">1.11.0"]
      - dependency-name: "ruamel.yaml"
        versions: [">0.19.1"]
      - dependency-name: "sortedcontainers"
        versions: [">2.4.0"]
      - dependency-name: "tornado"
        versions: [">6.5.10"]
      - dependency-name: "typing-extensions"
        versions: [">4.16.0"]
      - dependency-name: "urwid"
        versions: [">4.0.13"]
      - dependency-name: "wsproto"
        versions: [">1.3.2"]

    # mitmproxy-rs pins its platform wheels to its own exact version
    # (mitmproxy-rs 0.12.11 requires mitmproxy-linux/-macos/-windows==0.12.11).
    # Bumped individually they contradict each other and every such PR is
    # unmergeable (#88, #81). mitmproxy itself does NOT cap them
    # (mitmproxy-rs<0.13,>=0.12.6), so these bumps are wanted — they just have
    # to arrive as a single PR.
    groups:
      mitmproxy-rs:
        patterns:
          - "mitmproxy-rs"
          - "mitmproxy-linux"
          - "mitmproxy-macos"
          - "mitmproxy-windows"

  - package-ecosystem: "pip"
    directory: "/proxy"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # Same mitmproxy 12.3.0 ceilings as /requirements above: the proxy image is
    # built FROM mitmproxy/mitmproxy:12.3.0, so a cryptography, pyopenssl or
    # typing-extensions past what that mitmproxy declares cannot be installed
    # alongside it (#107, #112 were dead PRs of this kind).
    #
    # Dependabot does not only propose lock bumps here — it rewrites the
    # *constraint* to "permit the latest version" (#115). A ceiling dictated by
    # the base image cannot be inferred from what the package has published.
    ignore:
      - dependency-name: "cryptography"
        versions: [">50.0.2"]
      - dependency-name: "pyopenssl"
        versions: [">27.0.0"]
      - dependency-name: "typing-extensions"
        versions: [">4.16.0"]

  - package-ecosystem: "npm"
    directory: "/native-proxy/action"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # @actions/artifact 6.x is ESM-only and pulls in @azure/storage-common's
    # emscripten/WASM crc64 module, which does not survive ncc bundling
    # (uploads fail at runtime with "crc64_require is not a function").
    # 5.x is the newest line that bundles and runs; a bump past it requires
    # re-verifying `npm run build` + a runtime smoke test of dist/teardown.
    # This also covers Dependabot *security* updates, which run even without
    # an npm config section (that's how the broken 6.2.1 bump in PR #17
    # landed without dist/ being rebuilt).
    # @actions/cache 6.x has the same Azure crc64 bundling breakage; 5.x is
    # the newest line that loads under ncc.
    ignore:
      - dependency-name: "@actions/artifact"
        versions: [">=6"]
      - dependency-name: "@actions/cache"
        versions: [">=6"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/native-proxy/action"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/native-proxy/action-setup"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/native-proxy/action-teardown"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/container"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/proxy"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/runner"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
