name: "PipeWarden - Native Proxy"
description: "Set up native proxy firewall with automatic teardown via post-action. Teardown runs automatically at job end (even on failure) - no manual teardown step needed."

inputs:
  policy-file:
    description: "Path to a network policy YAML. Leave empty to auto-resolve: merge .github/pipewarden/common.network-policy.yml + .github/pipewarden/<workflow>.network-policy.yml, falling back to repo-root network-policy.yml, then discovery."
    required: false
    default: ""
  mode:
    description: "monitor (log only) or enforce (block unauthorized traffic)"
    required: false
    default: "enforce"
  fail-on-block:
    description: "Enforce mode: fail the job (non-zero exit) when any connection was blocked. Default 'true' stops the pipeline on a policy violation; set 'false' to block the traffic at the network level but let the job continue. Ignored in monitor mode (which never blocks)."
    required: false
    default: "true"
  proxy-port:
    description: "Port for mitmproxy to listen on"
    required: false
    default: "8080"
  dns:
    description: "Enable DNS interception (stops systemd-resolved, runs PipeWarden DNS server on 127.0.0.53:53)"
    required: false
    default: "true"
  transparent:
    description: "Enable iptables transparent proxy (true) or use env-var-only mode (false)"
    required: false
    default: "true"
  tls-intercept:
    description: "Terminate TLS to inspect request bodies, paths and query strings (true), or run without any MITM (false). Set false when the workflow uses certificate pinning or mutual TLS: no CA is generated or trusted and no proxy runs, so those clients work unchanged. PipeWarden then enforces at the DNS layer and logs connections via conntrack."
    required: false
    default: "true"
  cache:
    description: "Cache the proxy engine's pip wheels across runs (saves ~10-20s of setup). Set to 'false' to disable."
    required: false
    default: "true"
  upload-artifact:
    description: "Upload the generated report (/tmp/report/) as a build artifact at teardown. Set to 'false' to skip."
    required: false
    default: "true"
  artifact-name:
    description: "Name of the uploaded report artifact. Defaults to network-report-<job id> so two instrumented jobs in one workflow don't collide on upload."
    required: false
    default: ""
  canary:
    description: "Startup canary: after setup, make one HTTPS request and require it to appear in the connection log. 'true' fails setup (with full rollback of DNS/iptables changes) when the intercept records nothing, 'warn' only annotates, 'false' skips."
    required: false
    default: "true"
  attribution:
    description: "Record which client made each connection: 'client' reads the User-Agent from the decrypted request (free, no privileges, needs tls-intercept), 'process' additionally runs a small root helper that names the actual process behind each socket via the kernel socket table and audit connect() records, 'off' records nothing."
    required: false
    default: "client"
  attribution-cmdline:
    description: "attribution: process only. Also record each process's command line, scrubbed against the job's watched secrets and the built-in credential patterns. Off by default: a redactor cannot recognise a bespoke internal credential format, and command lines routinely carry tokens."
    required: false
    default: "false"
  fail-fast:
    description: "Enforce mode only: cancel the whole workflow run on the first blocked connection (instead of failing at teardown). Requires github-token with actions:write."
    required: false
    default: "false"
  github-token:
    description: "Token used to cancel the run when fail-fast triggers (pass the job's github.token; needs permissions: actions: write). Only used when fail-fast is true."
    required: false
    default: ""

outputs:
  report-path:
    description: "Path to the generated report directory"
  blocked-count:
    description: "Number of blocked connections"
  status:
    description: "pass or fail (fail when mode is enforce and blocked connections > 0)"

runs:
  using: "node24"
  main: "dist/setup/index.js"
  post: "dist/teardown/index.js"
  post-if: "always()"
