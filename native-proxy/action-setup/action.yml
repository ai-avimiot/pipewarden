name: "PipeWarden - Native Proxy Setup"
description: "Set up native proxy firewall on the GitHub Actions runner using mitmproxy as a background process"

inputs:
  policy-file:
    description: "Path to a network policy YAML. Leave empty to auto-resolve: merge .github/pipewarden/common.network-policy.yml + .github/pipewarden/<workflow>.network-policy.yml, falling back to repo-root network-policy.yml, then discovery."
    required: false
    default: ""
  mode:
    description: "monitor (log only) or enforce (block unauthorized traffic)"
    required: false
    default: "enforce"
  fail-on-block:
    description: "Enforce mode: fail the job (non-zero exit) when any connection was blocked. Default 'true' stops the pipeline on a policy violation; set 'false' to block the traffic but let the job continue. Ignored in monitor mode."
    required: false
    default: "true"
  proxy-port:
    description: "Port for mitmproxy to listen on"
    required: false
    default: "8080"
  dns:
    description: "Enable DNS interception (stops systemd-resolved, runs PipeWarden DNS server on 127.0.0.53:53)"
    required: false
    default: "true"
  transparent:
    description: "Enable iptables transparent proxy (true) or use env-var-only mode (false)"
    required: false
    default: "true"
  tls-intercept:
    description: "Terminate TLS to inspect request bodies, paths and query strings (true), or run without any MITM (false). Set false when the workflow uses certificate pinning or mutual TLS: no CA is generated or trusted and no proxy runs, so those clients work unchanged. PipeWarden then enforces at the DNS layer and logs connections via conntrack — no body scanning, path rules, or upstream-cert verification."
    required: false
    default: "true"
  attribution:
    description: "Record which client made each connection: 'client' reads the User-Agent from the decrypted request (free, no privileges, needs tls-intercept), 'process' additionally runs a small root helper that names the actual process behind each socket via the kernel socket table and audit connect() records, 'off' records nothing."
    required: false
    default: "client"
  attribution-cmdline:
    description: "attribution: process only. Also record each process's command line, scrubbed against the job's watched secrets and the built-in credential patterns. Off by default: a redactor cannot recognise a bespoke internal credential format, and command lines routinely carry tokens."
    required: false
    default: "false"
  fail-fast:
    description: "Enforce mode only: cancel the whole workflow run on the first blocked connection. Requires github-token with actions:write."
    required: false
    default: "false"
  github-token:
    description: "Token used to cancel the run when fail-fast triggers (pass the job's github.token; needs permissions: actions: write)."
    required: false
    default: ""
  mitmproxy-version:
    description: "Pinned mitmproxy version to install on the runner. Keep in lockstep with the proxy container base image."
    required: false
    default: ""
  canary:
    description: "Startup canary: after setup, make one HTTPS request and require it to appear in the connection log. 'true' fails setup (with full rollback of DNS/iptables changes) when the intercept records nothing, 'warn' only annotates, 'false' skips."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Run native proxy setup
      shell: bash
      run: bash ${{ github.action_path }}/../setup.sh
      env:
        INPUT_POLICY_FILE: ${{ inputs.policy-file }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_FAIL_ON_BLOCK: ${{ inputs.fail-on-block }}
        INPUT_PROXY_PORT: ${{ inputs.proxy-port }}
        INPUT_DNS: ${{ inputs.dns }}
        INPUT_TRANSPARENT: ${{ inputs.transparent }}
        INPUT_TLS_INTERCEPT: ${{ inputs.tls-intercept }}
        INPUT_ATTRIBUTION: ${{ inputs.attribution }}
        INPUT_ATTRIBUTION_CMDLINE: ${{ inputs.attribution-cmdline }}
        INPUT_FAIL_FAST: ${{ inputs.fail-fast }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_MITMPROXY_VERSION: ${{ inputs.mitmproxy-version }}
        INPUT_CANARY: ${{ inputs.canary }}
        INPUT_ACTION_PATH: ${{ github.action_path }}/..
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_REPOSITORY: ${{ github.repository }}
